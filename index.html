<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      cursor: pointer;
      position: relative;
    }
    video {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      background: #ffffff;
      outline: none;
    }
    .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.28);
      z-index: 5;
    }
    .play[hidden] { display: none !important; }
    .btn {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #EBB827;
      border: 3px solid #1E1E1C;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video
      id="player"
      src="guardian-endcard.mp4"
      playsinline
      webkit-playsinline
      preload="auto"
      controls
    ></video>
    <div class="play" id="overlay">
      <div class="btn" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 40 40">
          <path d="M14 8 L14 32 L32 20 Z" fill="#1E1E1C"/>
        </svg>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var v = document.getElementById("player");
      var overlay = document.getElementById("overlay");
      function start() {
        overlay.hidden = true;
        v.muted = false;
        v.currentTime = 0;
        var p = v.play();
        if (p && p.catch) p.catch(function () { overlay.hidden = false; });
      }
      overlay.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        start();
      });
      v.addEventListener("ended", function () {
        overlay.hidden = false;
        v.pause();
        v.currentTime = 0;
      });
    })();
  </script>
</body>
</html>
