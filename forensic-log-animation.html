<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      display: block;
      height: 100vh;
      width: auto;
      max-width: 100vw;
      max-height: 100vh;
    }
    audio { display: none; }

    .log-line {
      stroke: #1E1E1C;
      stroke-width: 4.4;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 16 11;
      animation: tickDash 8s linear infinite;
    }

    @keyframes tickDash {
      0%   { stroke-dashoffset: 0; }
      28%  { stroke-dashoffset: -54; }
      90%  { stroke-dashoffset: -54; }
      100% { stroke-dashoffset: 0; }
    }

    #magnifier {
      transform-box: fill-box;
      transform-origin: 48% 38%;
      animation: magSlide 8s cubic-bezier(0.45, 0.05, 0.25, 1) infinite;
    }
    @keyframes magSlide {
      0%, 3%   { transform: translateY(-228px); }
      24%      { transform: translateY(10px); }
      28%      { transform: translateY(-3px); }
      32%, 90% { transform: translateY(0); }
      97%, 100%{ transform: translateY(-228px); }
    }

    #glow-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: ringLock 8s ease-in-out infinite;
    }
    @keyframes ringLock {
      0%, 24%  { transform: scale(0.86); opacity: 0.55; }
      30%, 88% { transform: scale(1); opacity: 1; }
      96%, 100%{ transform: scale(0.86); opacity: 0.55; }
    }

    #highlight {
      transform-box: fill-box;
      transform-origin: center;
      animation: highlightPulse 8s ease-in-out infinite;
    }
    @keyframes highlightPulse {
      0%, 22%  { opacity: 0.55; }
      30%, 88% { opacity: 1; }
      96%, 100%{ opacity: 0.55; }
    }

    #card {
      transform-box: fill-box;
      transform-origin: 0% 55%;
      animation: cardPop 8s cubic-bezier(0.22, 1.4, 0.36, 1) infinite;
    }
    @keyframes cardPop {
      0%, 32%  { transform: scale(0); opacity: 0; }
      40%      { transform: scale(1.12); opacity: 1; }
      46%      { transform: scale(0.96); opacity: 1; }
      50%, 90% { transform: scale(1); opacity: 1; }
      96%, 100%{ transform: scale(0); opacity: 0; }
    }

    #connector {
      stroke-dasharray: 8 7;
      animation: connectorIn 8s ease-out infinite;
    }
    @keyframes connectorIn {
      0%, 32%  { opacity: 0; }
      38%, 90% { opacity: 1; }
      96%, 100%{ opacity: 0; }
    }

    #screenshot {
      animation: fadeShot 8s ease-out infinite;
    }
    @keyframes fadeShot {
      0%, 48%  { opacity: 0; }
      56%, 90% { opacity: 1; }
      96%, 100%{ opacity: 0; }
    }

    #video {
      animation: fadeVideo 8s ease-out infinite;
    }
    @keyframes fadeVideo {
      0%, 56%  { opacity: 0; }
      64%, 90% { opacity: 1; }
      96%, 100%{ opacity: 0; }
    }

    #spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkFlash 8s ease-in-out infinite;
    }
    @keyframes sparkFlash {
      0%, 66%  { opacity: 0; transform: scale(0.7); }
      68%      { opacity: 1; transform: scale(1.12); }
      71%      { opacity: 0; transform: scale(0.85); }
      74%      { opacity: 1; transform: scale(1.08); }
      78%      { opacity: 0; transform: scale(0.7); }
      90%      { opacity: 0; transform: scale(0.7); }
      100%     { opacity: 0; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <audio id="sfx" preload="auto" playsinline>
    <source src="forensic-log-sfx.mp3" type="audio/mpeg" />
    <source src="forensic-log-sfx.ogg" type="audio/ogg" />
    <source src="forensic-log-sfx.wav" type="audio/wav" />
  </audio>
  <svg viewBox="0 0 768 1376" xmlns="http://www.w3.org/2000/svg" role="img">
    <rect width="768" height="1376" fill="#FFFFFF"/>

    <!-- log stack -->
    <g id="logs" fill="none">
      <line class="log-line" x1="58" y1="548" x2="372" y2="548"/>
      <line class="log-line" x1="58" y1="612" x2="428" y2="612"/>
      <line class="log-line" x1="58" y1="676" x2="396" y2="676"/>

      <rect id="highlight" x="46" y="708" width="348" height="58" rx="14" fill="#EBB827"/>
      <line class="log-line" x1="58" y1="737" x2="430" y2="737"/>
      <g id="xmark" stroke="#1E1E1C" stroke-width="5.2" stroke-linecap="round">
        <line x1="78" y1="725" x2="108" y2="749"/>
        <line x1="108" y1="725" x2="78" y2="749"/>
      </g>

      <line class="log-line" x1="58" y1="800" x2="414" y2="800"/>
      <line class="log-line" x1="58" y1="864" x2="384" y2="864"/>
      <line class="log-line" x1="58" y1="928" x2="336" y2="928"/>
    </g>

    <!-- connector from marked row to card -->
    <g id="connector" fill="none" stroke="#1E1E1C" stroke-width="3.2" stroke-linecap="round">
      <line x1="396" y1="720" x2="458" y2="690" stroke-dasharray="7 6"/>
      <line x1="396" y1="754" x2="458" y2="790" stroke-dasharray="7 6"/>
    </g>

    <!-- magnifying glass -->
    <g id="magnifier">
      <line x1="400" y1="802" x2="478" y2="912"
            stroke="#1E1E1C" stroke-width="18" stroke-linecap="round"/>
      <circle cx="338" cy="737" r="84" fill="#FFFFFF" stroke="#1E1E1C" stroke-width="5.5"/>
      <circle id="glow-ring" cx="338" cy="737" r="30" fill="none" stroke="#EBB827" stroke-width="13"/>
    </g>

    <!-- evidence card -->
    <g id="card">
      <rect x="458" y="612" width="236" height="248" rx="20"
            fill="#FFFFFF" stroke="#1E1E1C" stroke-width="3.4" stroke-dasharray="11 8" stroke-linejoin="round"/>

      <g id="screenshot" fill="none" stroke="#1E1E1C">
        <rect x="478" y="636" width="156" height="112" rx="8"
              stroke-width="2.8" stroke-dasharray="7 6"/>
        <path d="M492 730 L528 678 L562 730 Z" fill="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M540 730 L592 658 L640 730 Z" fill="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"/>
        <circle cx="618" cy="672" r="9" fill="#EBB827" stroke="none"/>
        <line x1="492" y1="730" x2="626" y2="730" stroke-width="3.2" stroke-linecap="round"/>
      </g>

      <g id="video">
        <rect x="508" y="762" width="138" height="78" rx="12"
              fill="#FFFFFF" stroke="#1E1E1C" stroke-width="4"/>
        <path d="M556 782 L556 820 L594 801 Z"
              fill="#FFFFFF" stroke="#1E1E1C" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>

    <!-- lightning spark -->
    <g id="spark">
      <path d="M708 598 L682 650 L698 650 L668 714 L712 648 L694 648 Z"
            fill="#FFFFFF" stroke="#1E1E1C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </svg>
  <script>
    (function () {
      var a = document.getElementById("sfx");
      function play() {
        try {
          a.currentTime = 0;
          var p = a.play();
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      window.addEventListener("pointerdown", play);
      window.addEventListener("keydown", play);
    })();
  </script>
</body>
</html>
